<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IESO 词汇本 - AI智学工坊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC',sans-serif;background:#0a0e27;color:#e0e4f0;min-height:100vh}
        .top-bar{background:linear-gradient(135deg,#1a1f3a,#0d1233);border-bottom:1px solid rgba(100,140,255,.15);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .top-bar .logo{display:flex;align-items:center;gap:10px}
        .top-bar .logo i{font-size:24px;color:#5b8cff}
        .top-bar .logo span{font-size:18px;font-weight:600;background:linear-gradient(90deg,#5b8cff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .top-bar .back-link a{color:#8892b0;text-decoration:none;font-size:14px}
        .top-bar .back-link a:hover{color:#5b8cff}
        .main{max-width:1100px;margin:0 auto;padding:28px 16px}
        .header{text-align:center;margin-bottom:28px}
        .header h1{font-size:30px;font-weight:700;background:linear-gradient(90deg,#5b8cff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
        .header p{color:#8892b0;font-size:14px}
        .search-bar{display:flex;gap:10px;max-width:600px;margin:0 auto 16px}
        .search-bar input{flex:1;padding:12px 18px;border-radius:10px;border:1px solid rgba(100,140,255,.2);background:rgba(255,255,255,.06);color:#e0e4f0;font-size:14px;outline:none;font-family:inherit}
        .search-bar input:focus{border-color:#5b8cff}
        .filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
        .filters button{padding:6px 14px;border-radius:16px;border:1px solid rgba(100,140,255,.15);background:transparent;color:#8892b0;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
        .filters button:hover{border-color:#5b8cff;color:#e0e4f0}
        .filters button.on{background:linear-gradient(135deg,#5b8cff33,#7c5cfc33);border-color:#5b8cff;color:#5b8cff}
        .letter-nav{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
        .letter-nav button{width:32px;height:30px;border-radius:6px;border:1px solid rgba(100,140,255,.08);background:transparent;color:#5a6380;font-size:12px;cursor:pointer;font-family:inherit;transition:all .12s}
        .letter-nav button:hover{border-color:#5b8cff;color:#e0e4f0}
        .letter-nav button.on{background:#5b8cff;color:#fff;border-color:#5b8cff}
        .table-container{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th{text-align:left;padding:10px 12px;color:#5a6380;font-weight:500;border-bottom:1px solid rgba(100,140,255,.08);position:sticky;top:57px;background:#0a0e27;z-index:10}
        td{padding:8px 12px;border-bottom:1px solid rgba(100,140,255,.04);vertical-align:top}
        .en-cell{color:#e0e4f0;font-weight:500;width:220px;min-width:150px}
        .zh-cell{color:#8892b0;width:auto;min-width:120px}
        .tag-cell{width:70px;min-width:60px;text-align:center}
        .ex-cell{color:#5a6380;font-size:12px;font-style:italic;width:auto;min-width:180px}
        .tag-badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:500}
        .tg-ieso{background:#5b8cff22;color:#5b8cff}
        .tg-marine{background:#22d3ee22;color:#22d3ee}
        .tg-geo{background:#f59e0b22;color:#f59e0b}
        .tg-atmo{background:#34d39922;color:#34d399}
        .tg-astro{background:#f472b622;color:#f472b6}
        .tg-hydro{background:#38bdf822;color:#38bdf8}
        .tg-tech{background:#a78bfa22;color:#a78bfa}
        .pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
        .pager button{padding:7px 14px;border-radius:7px;border:1px solid rgba(100,140,255,.15);background:transparent;color:#8892b0;cursor:pointer;font-size:13px;font-family:inherit}
        .pager button:hover{border-color:#5b8cff;color:#e0e4f0}
        .pager button:disabled{opacity:.3;cursor:default}
        .pager .info{color:#5a6380;font-size:13px}
        .pager .goto{display:flex;gap:4px;align-items:center}
        .pager .goto input{width:50px;padding:5px 6px;border-radius:5px;border:1px solid rgba(100,140,255,.12);background:rgba(255,255,255,.04);color:#e0e4f0;font-size:12px;text-align:center;outline:none;font-family:inherit}
        .footer{text-align:center;color:#5a6380;font-size:12px;margin-top:20px;padding:12px;border-top:1px solid rgba(100,140,255,.06)}
        .loading{padding:60px;text-align:center;color:#5a6380}
        .loading i{font-size:28px;margin-bottom:12px}
        .load-more{margin:20px auto;display:block;padding:12px 32px;border-radius:10px;border:1px solid rgba(100,140,255,.2);background:linear-gradient(135deg,#5b8cff22,#7c5cfc22);color:#5b8cff;cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
        .load-more:hover{background:linear-gradient(135deg,#5b8cff44,#7c5cfc44)}
        @media(max-width:640px){
            td,th{padding:6px 8px;font-size:12px}
            .en-cell{width:120px;min-width:80px}
            .tag-cell{width:50px;min-width:40px}
            .ex-cell{display:none}
        }
    </style>
</head>
<body>
<div class="top-bar">
    <div class="logo"><i class="fas fa-book"></i><span>AI智学工坊</span></div>
    <div class="back-link"><a href="../"><i class="fas fa-arrow-left"></i> 返回首页</a></div>
</div>
<div class="main">
    <div class="header">
        <h1>IESO 专业词汇本</h1>
        <p id="totalInfo">International Earth Science Olympiad · 加载中...</p>
    </div>
    <div class="search-bar">
        <input id="q" placeholder="搜索英文/中文..." oninput="doQuery()">
    </div>
    <div class="filters" id="filterBar">
        <button class="on" data-f="all" onclick="setF('all',this)">全部</button>
        <button data-f="ieso" onclick="setF('ieso',this)">IESO</button>
        <button data-f="geo" onclick="setF('geo',this)">地质</button>
        <button data-f="marine" onclick="setF('marine',this)">海洋</button>
        <button data-f="atmo" onclick="setF('atmo',this)">大气</button>
        <button data-f="hydro" onclick="setF('hydro',this)">水文</button>
        <button data-f="astro" onclick="setF('astro',this)">天文</button>
        <button data-f="tech" onclick="setF('tech',this)">技术</button>
    </div>
    <div class="letter-nav" id="letterNav"></div>
    <div class="table-container">
        <table>
            <thead><tr>
                <th class="en-cell">英文</th>
                <th class="zh-cell">中文</th>
                <th class="tag-cell">分类</th>
                <th class="ex-cell">例句</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
    <button class="load-more" id="loadMore" onclick="loadMore()" style="display:none">加载更多 <i class="fas fa-chevron-down"></i></button>
    <div class="pager" id="pager"></div>
    <div class="footer" id="footer"></div>
</div>
<script>
const PAGE = 100;
let all=[], filt=[], curF='all', curL='', curP=1, ttlP=1, loadedBatch=-1;

const TL = {ieso:'IESO', marine:'海洋', geo:'地质', atmo:'大气', hydro:'水文', astro:'天文', tech:'技术'};
const TC = {ieso:'tg-ieso', marine:'tg-marine', geo:'tg-geo', atmo:'tg-atmo', hydro:'tg-hydro', astro:'tg-astro', tech:'tg-tech'};

function doQuery(){
    curL='';
    document.querySelectorAll('.letter-nav button').forEach(b=>b.classList.remove('on'));
    showP(1);
}

function setF(f,b){
    curF=f;
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));
    b.classList.add('on');
    curL='';
    document.querySelectorAll('.letter-nav button').forEach(b=>b.classList.remove('on'));
    showP(1);
}

function setL(l,b){
    if(curL===l){curL='';b.classList.remove('on')}
    else{curL=l;document.querySelectorAll('.letter-nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
    showP(1);
}

function getFilt(){
    let l=all;
    if(curF!='all') l=l.filter(w=>w.tag===curF);
    const q=document.getElementById('q').value.trim().toLowerCase();
    if(q) l=l.filter(w=>w.en.toLowerCase().includes(q)||w.zh.includes(q));
    if(curL) l=l.filter(w=>w.en[0].toUpperCase()===curL);
    return l;
}

function showP(p){
    filt=getFilt();
    ttlP=Math.ceil(filt.length/PAGE)||1;
    if(p<1)p=1;if(p>ttlP)p=ttlP;curP=p;
    const start=(curP-1)*PAGE, end=Math.min(start+PAGE,filt.length);
    const page=filt.slice(start,end);
    const tbody=document.getElementById('tbody');
    tbody.innerHTML='';
    page.forEach(w=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`
            <td class="en-cell">${w.en}</td>
            <td class="zh-cell">${w.zh}</td>
            <td class="tag-cell"><span class="tag-badge ${TC[w.tag]||'tg-ieso'}">${TL[w.tag]||w.tag}</span></td>
            <td class="ex-cell">${w.example||''}</td>
        `;
        tbody.appendChild(tr);
    });
    const lm=document.getElementById('loadMore');
    lm.style.display='none';
    document.getElementById('totalInfo').textContent=`International Earth Science Olympiad · 共 ${all.length} 个词汇`;
    document.getElementById('footer').textContent=`显示 ${start+1}-${end} / ${filt.length} 个过滤结果`;
    // pager
    const pg=document.getElementById('pager');
    pg.innerHTML=`
        <button onclick="showP(1)" ${curP<=1?'disabled':''}><i class="fas fa-angle-double-left"></i></button>
        <button onclick="showP(${curP-1})" ${curP<=1?'disabled':''}><i class="fas fa-angle-left"></i></button>
        <span class="info">${curP}/${ttlP}</span>
        <button onclick="showP(${curP+1})" ${curP>=ttlP?'disabled':''}><i class="fas fa-angle-right"></i></button>
        <button onclick="showP(${ttlP})" ${curP>=ttlP?'disabled':''}><i class="fas fa-angle-double-right"></i></button>
        <span class="goto">跳 <input type="number" id="gp" min="1" max="${ttlP}" style="width:45px"> <button onclick="showP(parseInt(document.getElementById('gp').value)||1)">Go</button></span>
    `;
}

function loadMore(){
    // progressive load from data chunks - future feature
    loadedBatch++;
    // placeholder
}

async function init(){
    const r = await fetch('vocab.json?'+Date.now());
    all = await r.json();
    const l = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const nav = document.getElementById('letterNav');
    l.forEach(c=>{
        const b=document.createElement('button');
        b.textContent=c; b.onclick=()=>setL(c,b);
        nav.appendChild(b);
    });
    showP(1);
}
init();
</script>
</body>
</html>
