<title>思维导图速记 高中英语词汇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#c67c4e;--primary-l:#f5eee8;--primary-d:#a86136;--bg:#faf8f6;--card:#fff;--text:#1d1d1f;--text2:#6e6e73;--border:#e0d5c8}
body{font-family:-apple-system,'PingFang SC','SF Pro','Helvetica Neue',sans-serif;background:#fff;color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* Apple-style hero */
.hero{background:var(--text);color:#fff;padding:48px 20px 36px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 50% 0%,#c67c4e33 0%,transparent 70%);pointer-events:none}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-.5px;position:relative}
.hero p{font-size:14px;opacity:.7;margin-top:6px;position:relative}
.hero .stats{display:flex;justify-content:center;gap:20px;margin-top:14px;font-size:13px;position:relative}
.hero .stats span{background:rgba(255,255,255,.1);padding:4px 14px;border-radius:20px}

/* Search bar - Apple style */
.search-wrap{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.06);padding:10px 16px}
.search-wrap .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:960px;margin:0 auto}
.search-wrap input{flex:1;min-width:120px;padding:8px 16px;border:1px solid #d2d2d7;border-radius:24px;font-size:14px;outline:none;background:#f5f5f7;transition:all .2s}
.search-wrap input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(198,124,78,.15)}
.flt{font-size:12px;padding:4px 14px;border:1px solid #d2d2d7;border-radius:18px;cursor:pointer;background:#fff;color:var(--text2);transition:all .2s;user-select:none}
.flt.on{color:#fff;border-color:var(--primary)}
.flt.on.h{background:var(--primary)}
.flt.on.m{background:#b8987a}
.flt.on.l{background:#999}
.info-bar{font-size:13px;color:var(--text2);text-align:center;padding:8px;background:#f5f5f7;border-bottom:1px solid rgba(0,0,0,.06)}

/* Content */
#c{max-width:960px;margin:0 auto;padding:14px 12px}

/* Apple-style section */
.sec{background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06)}
.sec-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sec-hd:active{opacity:.7}
.sec-hd .title{font-size:16px;font-weight:600;color:var(--text)}
.sec-hd .title .meta{font-weight:400;font-size:13px;color:var(--text2);margin-left:6px}
.sec-hd .arrow{width:20px;height:20px;display:flex;align-items:center;justify-content:center;transition:transform .3s;color:var(--text2);font-size:12px}
.sec-hd.c .arrow{transform:rotate(-90deg)}
.sec-bd{display:grid;grid-template-columns:1fr;padding:0 14px 14px}
.sec-bd.h{display:none}

/* Apple-style theme card */
.theme-card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:box-shadow .2s}
.theme-card:active{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.theme-hd{text-align:center;padding:18px 14px 12px;background:linear-gradient(180deg,var(--primary-l) 0%,#fff 100%)}
.theme-hd .root{font-size:22px;font-weight:700;color:var(--primary-d);letter-spacing:1px}
.theme-hd .root .emoji-icon{font-size:20px;margin-right:6px}
.theme-hd .root-cn{font-size:13px;color:var(--text2);margin-top:2px}
.theme-bd{padding:6px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px}
.word-item{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:6px;font-size:14px;gap:4px}
.word-item .en{font-weight:500;color:var(--text)}
.word-item .zh{color:var(--text2);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px}
.word-item .lv{font-size:8px;padding:1px 4px;border-radius:4px;flex-shrink:0;opacity:.7}
.word-item .lv.h{background:#f0e6da;color:#8b5e3c}
.word-item .lv.m{background:#f5f0e8;color:#7a6b5a}
.word-item .lv.l{background:#eee;color:#888}

/* Category emoji map */
.theme-card[data-theme^="e"] .theme-hd{background:linear-gradient(180deg,#e8f4ed 0%,#fff 100%)}
.theme-card[data-theme^="s"] .theme-hd{background:linear-gradient(180deg,#f0eef8 0%,#fff 100%)}
.theme-card[data-theme^="c"] .theme-hd{background:linear-gradient(180deg,#fef5e7 0%,#fff 100%)}

.loader{text-align:center;padding:60px}
.loader .sp{display:inline-block;width:28px;height:28px;border:3px solid #e0d5c8;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px;color:var(--text2);font-size:15px}

/* iOS-friendly */
@media(max-width:600px){
  .hero{padding:36px 16px 28px}
  .hero h1{font-size:22px}
  .theme-bd{grid-template-columns:1fr 1fr}
  .search-wrap .row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .flt{flex-shrink:0}
}
</style>
</head>

    document.getElementById("tg").textContent=ts.size;
    go();
  }catch(e){document.getElementById("c").innerHTML='<div class="empty">⚠️ '+'加载失败: '+e.message+"</div>"}
}

function go(){
  let q=fl.q.toLowerCase();
  F=W.filter(w=>{
    if((w.level==="高频"&&!fl.h)||(w.level==="中频"&&!fl.m)||(w.level==="补充"&&!fl.l))return 0;
    if(q&&!w.en.toLowerCase().includes(q)&&!w.zh.includes(q))return 0;
    return 1;
  });
  document.getElementById("sc").textContent=F.length;
  rn();
}

function rn(){
  let c=document.getElementById("c"),h="";
  if(!F.length){c.innerHTML='<div class="empty">📭 没有匹配的词汇</div>';return}
  
  let pp=W.length/45;
  let totG=0;
  
  for(let i=1;i<=45;i++){
    let st=Math.round((i-1)*pp),en=Math.round(Math.min(i*pp,W.length));
    let lw=F.filter(w=>W.indexOf(w)>=st&&W.indexOf(w)<en);
    if(!lw.length)continue;
    
    let g={};
    lw.forEach(w=>{let key=w.theme||"其他";if(!g[key])g[key]=[];g[key].push(w);});
    
    let gc=Object.keys(g).length;
    totG+=gc;
    
    h+='<div class="sec"><div class="sec-hd" onclick="this.classList.toggle(\'c\');this.nextElementSibling.classList.toggle(\'h\')"><span class="title">📘 单元'+i+' <span class="meta">'+lw.length+'词 · '+gc+'组</span></span><span class="arrow">▼</span></div><div class="sec-bd">';
    
    let sorted=Object.entries(g).sort((a,b)=>b[1].length-a[1].length);
    
    for(let [theme,words] of sorted){
      let emoji=TE[theme]||"📝";
      h+='<div class="theme-card" data-theme="'+theme[0]+'"><div class="theme-hd"><div class="root"><span class="emoji-icon">'+emoji+'</span>'+theme+'</div></div><div class="theme-bd">';
      for(let w of words){
        let lc=w.level==="高频"?"h":w.level==="中频"?"m":"l";
        let ll=w.level==="高频"?"🔥":w.level==="中频"?"📖":"🌱";
        h+='<div class="word-item"><span class="en">'+w.en+'</span><span class="zh">'+w.zh+' <span class="lv '+lc+'">'+ll+'</span></span></div>';
      }
      h+='</div></div>';
    }
    
    h+='</div></div>';
  }
  document.getElementById("sg").textContent=totG;
  c.innerHTML=h;
}

document.getElementById("q").addEventListener("input",function(){
  clearTimeout(window._dt);
  window._dt=setTimeout(()=>{fl.q=this.value;go()},200);
});
load();
</script>
