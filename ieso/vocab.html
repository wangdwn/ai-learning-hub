<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>高中英语词汇 4482词</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#faf8f6;color:#333;font-size:14px}
header{background:linear-gradient(135deg,#c67c4e,#d8946a);color:#fff;padding:24px 16px 16px;text-align:center}
header h1{font-size:20px;font-weight:700}
header p{font-size:13px;opacity:.85;margin-top:3px}
.top-bar{background:#fff;border-bottom:1px solid #e0d5c8;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:20}
.top-bar input{flex:1;min-width:120px;max-width:260px;padding:6px 12px;border:1px solid #e0d5c8;border-radius:16px;font-size:13px;outline:none}
.top-bar input:focus{border-color:#c67c4e}
.f{display:inline-block;padding:3px 10px;border:1px solid #e0d5c8;border-radius:12px;font-size:12px;cursor:pointer;background:#fff;color:#999;user-select:none}
.f.on{border-color:#c67c4e;color:#fff}
.f.on.h{background:#c67c4e}
.f.on.m{background:#b8987a}
.f.on.l{background:#999}
.s{text-align:center;font-size:12px;color:#888;padding:6px;background:#fff;border-bottom:1px solid #e0d5c8}
#w{max-width:860px;margin:0 auto;padding:10px 12px}
.w{border:1px solid #e0d5c8;border-radius:6px;margin-bottom:6px;overflow:hidden}
.w-h{background:#f5eee8;padding:8px 12px;font-weight:700;font-size:14px;color:#c67c4e;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.w-h .a{transition:transform .2s;font-size:10px;color:#888}
.w-h.c .a{transform:rotate(-90deg)}
.w-b{padding:6px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px}
.w-b.h{display:none}
.it{display:flex;justify-content:space-between;align-items:center;padding:3px 0;gap:4px;border-bottom:1px dotted #f0e8e0;font-size:13px}
.it:last-child{border:0}
.it .e{font-weight:500}
.it .z{color:#888;font-size:12px;text-align:right}
.tg{font-size:10px;padding:1px 6px;border-radius:5px;flex-shrink:0;white-space:nowrap}
.tg.h{background:#f0e6da;color:#8b5e3c}
.tg.m{background:#f5f0e8;color:#7a6b5a}
.tg.l{background:#f0f0f0;color:#666}
.l{text-align:center;padding:40px;color:#888}
.l .sp{display:inline-block;width:22px;height:22px;border:2px solid #e0d5c8;border-top-color:#c67c4e;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><h1>📖 高中英语词汇</h1><p>俞敏洪 编著 · <span id="t">0</span> 词 · 45 单元</p></header>
<div class="top-bar">
<input id="q" placeholder="🔍 搜单词或释义...">
<div class="f on h" onclick="l(this,'h')">高频</div>
<div class="f on m" onclick="l(this,'m')">中频</div>
<div class="f on l" onclick="l(this,'l')">补充</div>
</div>
<div class="s">已显示 <span id="s">0</span> 条</div>
<div id="w"><div class="l"><div class="sp"></div></div></div>

<script>
let V=[],F=[],fl={h:1,m:1,l:1,q:""},L=45;
function l(el,t){el.classList.toggle("on");fl.h=!!document.querySelector(".f.on.h");fl.m=!!document.querySelector(".f.on.m");fl.l=!!document.querySelector(".f.on.l");go()}

async function load(){
  try{
    let r=await fetch("vocab.json?_="+Date.now());
    if(!r.ok)throw Error(String(r.status));
    V=await r.json();
    document.getElementById("t").textContent=V.length;
    go();
  }catch(e){document.getElementById("w").innerHTML='<div class="l">⚠️ 加载失败: '+e.message+'</div>'}
}

function go(){
  let q=fl.q.toLowerCase();
  F=V.filter(w=>{
    if((w.level==="高频"&&!fl.h)||(w.level==="中频"&&!fl.m)||(w.level==="补充"&&!fl.l))return 0;
    if(q&&!w.en.toLowerCase().includes(q)&&!w.zh.includes(q))return 0;
    return 1;
  });
  document.getElementById("s").textContent=F.length;
  rn();
}

function rn(){
  let c=document.getElementById("w"),h="";
  if(!F.length){c.innerHTML='<div class="l">📭 无匹配</div>';return}
  
  let pp=V.length/L;
  for(let i=1;i<=L;i++){
    let st=Math.round((i-1)*pp),en=Math.round(Math.min(i*pp,V.length));
    let lw=F.filter(w=>V.indexOf(w)>=st&&V.indexOf(w)<en);
    if(!lw.length)continue;
    
    h+='<div class="w"><div class="w-h" onclick="this.classList.toggle(\'c\');this.nextElementSibling.classList.toggle(\'h\')"><span>📘 单元'+i+' ('+lw.length+'词)</span><span class="a">▼</span></div><div class="w-b">';
    for(let w of lw){
      let lc=w.level==="高频"?"h":w.level==="中频"?"m":"l";
      let ll=w.level==="高频"?"🔥":w.level==="中频"?"📖":"🌱";
      h+='<div class="it"><span class="e">'+w.en+'</span><span class="z">'+w.zh+' <span class="tg '+lc+'">'+ll+'</span></span></div>';
    }
    h+='</div></div>';
  }
  c.innerHTML=h;
}

document.getElementById("q").addEventListener("input",function(){
  clearTimeout(window._t);
  window._t=setTimeout(()=>{fl.q=this.value;go()},200);
});
load();
</script>
</body>
</html>
