<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思维导图速记 高中英语词汇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#faf8f6;color:#333;font-size:14px}
header{background:linear-gradient(135deg,#c67c4e,#d8946a);color:#fff;padding:22px 16px 14px;text-align:center}
header h1{font-size:20px;font-weight:700}
header p{font-size:13px;opacity:.85;margin-top:2px}
.top{background:#fff;border-bottom:1px solid #e0d5c8;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:0;z-index:20}
.top input{flex:1;min-width:100px;max-width:240px;padding:6px 12px;border:1px solid #e0d5c8;border-radius:16px;font-size:13px;outline:none}
.top input:focus{border-color:#c67c4e}
.tag{display:inline-block;padding:3px 10px;border:1px solid #e0d5c8;border-radius:12px;font-size:12px;cursor:pointer;background:#fff;color:#999;user-select:none}
.tag.on{border-color:#c67c4e;color:#fff}
.tag.on.h{background:#c67c4e}
.tag.on.m{background:#b8987a}
.tag.on.l{background:#999}
.info{text-align:center;font-size:12px;color:#888;padding:5px;background:#fff;border-bottom:1px solid #e0d5c8}
#c{max-width:960px;margin:0 auto;padding:10px 12px}

/* List section */
.ls{border:1px solid #e0d5c8;border-radius:8px;margin-bottom:12px;overflow:hidden}
.lh{background:#f5eee8;padding:8px 12px;font-weight:700;font-size:14px;color:#c67c4e;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.lh .ar{transition:transform .2s;font-size:10px;color:#888}
.lh.c .ar{transform:rotate(-90deg)}
.lh .lst{font-weight:400;font-size:12px;color:#888}

/* Theme group grid */
.lg{display:none}
.lg.on{display:block;padding:10px}
.gr{border:1px solid #e0d5c8;border-radius:8px;margin-bottom:8px;overflow:hidden}
.gh{background:#f5eee8;padding:7px 10px;font-weight:700;font-size:14px;color:#c67c4e;text-align:center;border-bottom:1px solid #e0d5c8}
.gw{padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:3px}
.gi{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted #f0e8e0;gap:4px;font-size:13px}
.gi:last-child{border:0}
.gi .en{font-weight:500}
.gi .zh{color:#888;font-size:12px;text-align:right}
.lvl{font-size:10px;padding:1px 5px;border-radius:5px;flex-shrink:0}
.lvl.h{background:#f0e6da;color:#8b5e3c}
.lvl.m{background:#f5f0e8;color:#7a6b5a}
.lvl.l{background:#f0f0f0;color:#666}
.load{text-align:center;padding:50px;color:#888}
.load .sp{display:inline-block;width:22px;height:22px;border:2px solid #e0d5c8;border-top-color:#c67c4e;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px;color:#888}
</style>
</head>
<body>
<header><h1>🌿 思维导图速记 高中英语词汇</h1><p>俞敏洪 编著 · <span id="tw">0</span> 词 · <span id="tt">0</span> 词根组 · 45 单元</p></header>
<div class="top">
  <input id="q" placeholder="🔍 搜单词或中文...">
  <span class="tag on h" onclick="tgl(this)">高频</span>
  <span class="tag on m" onclick="tgl(this)">中频</span>
  <span class="tag on l" onclick="tgl(this)">补充</span>
</div>
<div class="info">显示 <span id="sc">0</span> 词 · <span id="gc">0</span> 组</div>
<div id="c"><div class="load"><div class="sp"></div></div></div>

<script>
let W=[],F=[],fl={h:1,m:1,l:1,q:""};
function tgl(el){el.classList.toggle("on");fl.h=!!document.querySelector(".tag.on.h");fl.m=!!document.querySelector(".tag.on.m");fl.l=!!document.querySelector(".tag.on.l");go()}

async function load(){
  try{
    let r=await fetch("vocab.json?_="+Date.now());
    if(!r.ok)throw Error("HTTP "+r.status);
    W=await r.json();
    document.getElementById("tw").textContent=W.length;
    // Count unique themes
    let ts=new Set(W.filter(w=>w.theme).map(w=>`${w.list}_${w.theme}`));
    document.getElementById("tt").textContent=ts.size;
    go();
  }catch(e){document.getElementById("c").innerHTML='<div class="empty">⚠️ 加载失败: '+e.message+"</div>"}
}

function go(){
  let q=fl.q.toLowerCase();
  F=W.filter(w=>{
    if((w.level==="高频"&&!fl.h)||(w.level==="中频"&&!fl.m)||(w.level==="补充"&&!fl.l))return 0;
    if(q&&!w.en.toLowerCase().includes(q)&&!w.zh.includes(q))return 0;
    return 1;
  });
  document.getElementById("sc").textContent=F.length;
  rn();
}

function rn(){
  let c=document.getElementById("c"),h="";
  if(!F.length){c.innerHTML='<div class="empty">📭 无匹配</div>';return}
  
  let pp=W.length/45;
  let totG=0;
  
  for(let i=1;i<=45;i++){
    let st=Math.round((i-1)*pp),en=Math.round(Math.min(i*pp,W.length));
    let lw=F.filter(w=>W.indexOf(w)>=st&&W.indexOf(w)<en);
    if(!lw.length)continue;
    
    // Group by theme
    let g={};
    lw.forEach(w=>{
      let key=w.theme||"其他";
      if(!g[key])g[key]=[];
      g[key].push(w);
    });
    
    let gc=Object.keys(g).length;
    totG+=gc;
    
    h+='<div class="ls"><div class="lh" onclick="this.classList.toggle(\'c\');this.nextElementSibling.classList.toggle(\'on\')">'
      +'<span>📘 单元'+i+' <span class="lst">'+lw.length+'词 · '+gc+'组</span></span>'
      +'<span class="lst">展开 <span class="ar">▼</span></span>'
      +'</div><div class="lg">';
    
    // Sort themes by group size (largest first)
    let sorted=Object.entries(g).sort((a,b)=>b[1].length-a[1].length);
    
    for(let [theme,words] of sorted){
      h+='<div class="gr"><div class="gh">'+theme+'</div><div class="gw">';
      for(let w of words){
        let lc=w.level==="高频"?"h":w.level==="中频"?"m":"l";
        let ll=w.level==="高频"?"🔥":w.level==="中频"?"📖":"🌱";
        h+='<div class="gi"><span class="en">'+w.en+'</span><span class="zh">'+w.zh+' <span class="lvl '+lc+'">'+ll+'</span></span></div>';
      }
      h+='</div></div>';
    }
    
    h+='</div></div>';
  }
  document.getElementById("gc").textContent=totG;
  c.innerHTML=h;
}

document.getElementById("q").addEventListener("input",function(){
  clearTimeout(window._st);
  window._st=setTimeout(()=>{fl.q=this.value;go()},200);
});
load();
</script>
</body>
</html>
