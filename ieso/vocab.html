<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#c67c4e;--primary-l:#f5eee8;--primary-d:#a86136;--bg:#faf8f6;--card:#fff;--text:#1d1d1f;--text2:#6e6e73;--border:#e0d5c8}
body{font-family:-apple-system,'PingFang SC','SF Pro','Helvetica Neue',sans-serif;background:#f5f5f7;color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

.hero{background:var(--text);color:#fff;padding:60px 20px 44px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 50% 0%,#c67c4e33 0%,transparent 70%);pointer-events:none}
.hero h1{font-size:32px;font-weight:700;letter-spacing:-.5px;position:relative}
.hero p{font-size:15px;opacity:.7;margin-top:8px;position:relative}
.hero .stats{display:flex;justify-content:center;gap:24px;margin-top:18px;font-size:13px;position:relative;flex-wrap:wrap}
.hero .stats span{background:rgba(255,255,255,.1);padding:5px 16px;border-radius:20px}

.search-wrap{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06);padding:10px 16px}
.search-wrap .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:960px;margin:0 auto}
.search-wrap input{flex:1;min-width:120px;padding:8px 16px;border:1px solid #d2d2d7;border-radius:24px;font-size:14px;outline:none;background:#f5f5f7;transition:all .2s}
.search-wrap input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(198,124,78,.15)}
.flt{font-size:12px;padding:4px 14px;border:1px solid #d2d2d7;border-radius:18px;cursor:pointer;background:#fff;color:var(--text2);transition:all .2s;user-select:none}
.flt.on{color:#fff;border-color:var(--primary)}
.flt.on.h{background:var(--primary)}
.flt.on.m{background:#b8987a}
.flt.on.l{background:#999}
.info-bar{font-size:13px;color:var(--text2);text-align:center;padding:8px;background:#f5f5f7;border-bottom:1px solid rgba(0,0,0,.06)}

#c{max-width:960px;margin:0 auto;padding:20px 16px 60px}

.sec{background:var(--card);border-radius:20px;margin-bottom:20px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06)}
.sec-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .2s}
.sec-hd:hover{background:rgba(0,0,0,.01)}
.sec-hd:active{opacity:.7}
.sec-hd .title{font-size:17px;font-weight:600;color:var(--text)}
.sec-hd .title .meta{font-weight:400;font-size:13px;color:var(--text2);margin-left:8px}
.sec-hd .arrow{width:20px;height:20px;display:flex;align-items:center;justify-content:center;transition:transform .3s;color:var(--text2);font-size:12px}
.sec-hd.c .arrow{transform:rotate(-90deg)}
.sec-bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 16px 16px}
.sec-bd.h{display:none}

/* Apple-style theme card with AI illustration */
.theme-card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(0,0,0,.03);transition:all .3s ease}
.theme-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}

/* Image area */
.theme-img{width:100%;height:140px;background:#e8e8ed;position:relative;overflow:hidden}
.theme-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease,opacity .6s ease;opacity:0}
.theme-img img.loaded{opacity:1}
.theme-card:hover .theme-img img{transform:scale(1.04)}
.theme-img .gradient{position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none;z-index:1}
.theme-img .img-label{position:absolute;bottom:10px;left:14px;color:#fff;font-size:20px;font-weight:700;z-index:2;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.theme-img .img-label .emoji-icon{font-size:18px;margin-right:4px}

/* Skeleton loading */
.theme-img .skeleton{position:absolute;inset:0;background:linear-gradient(90deg,#e8e8ed 25%,#f0f0f2 50%,#e8e8ed 75%);background-size:200% 100%;animation:shimmer 1.8s infinite;z-index:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Fallback header for themes without AI image */
.theme-hd-fb{text-align:center;padding:18px 14px 12px;background:linear-gradient(180deg,var(--primary-l) 0%,#fff 100%);border-radius:14px 14px 0 0}
.theme-hd-fb .root{font-size:20px;font-weight:700;color:var(--primary-d);letter-spacing:1px}
.theme-hd-fb .root .emoji-icon{font-size:18px;margin-right:6px}

/* Word area */
.theme-bd{padding:10px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:3px}
.word-item{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:8px;font-size:14px;gap:4px;transition:background .15s}
.word-item:hover{background:#f5f5f7}
.word-item .en{font-weight:500;color:var(--text)}
.word-item .zh{color:var(--text2);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.word-item .lv{font-size:8px;padding:1px 5px;border-radius:4px;flex-shrink:0;opacity:.7}
.word-item .lv.h{background:#f0e6da;color:#8b5e3c}
.word-item .lv.m{background:#f5f0e8;color:#7a6b5a}
.word-item .lv.l{background:#eee;color:#888}

.loader{text-align:center;padding:80px}
.loader .sp{display:inline-block;width:32px;height:32px;border:3px solid #e0d5c8;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:80px;color:var(--text2);font-size:16px}

@media(max-width:640px){
  .hero{padding:44px 16px 32px}
  .hero h1{font-size:24px}
  .sec-bd{grid-template-columns:1fr}
  .theme-bd{grid-template-columns:1fr 1fr}
  .theme-img{height:110px}
  .search-wrap .row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .flt{flex-shrink:0}
}
</style>

function imgUrl(theme){var p=PROMPTS[theme];if(!p)return'';return'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width=600&height=300&nologo=true&model=flux&seed='+(theme.length*42);}

let W=[],F=[];
let fl={h:1,m:1,l:1,q:""};

function tg(el){el.classList.toggle("on");fl.h=!!document.querySelector(".flt.on.h");fl.m=!!document.querySelector(".flt.on.m");fl.l=!!document.querySelector(".flt.on.l");go();}

async function load(){try{let r=await fetch("vocab.json?_="+Date.now());if(!r.ok)throw Error("HTTP "+r.status);W=await r.json();let ts=new Set(W.filter(function(w){return w.theme}).map(function(w){return w.list+"_"+w.theme}));document.getElementById("tw").textContent=W.length;document.getElementById("tg").textContent=ts.size;go();}catch(e){document.getElementById("c").innerHTML='<div class="empty">⚠️ 加载失败: '+e.message+"</div>";}}

function go(){var q=fl.q.toLowerCase();F=W.filter(function(w){if((w.level==="高频"&&!fl.h)||(w.level==="中频"&&!fl.m)||(w.level==="补充"&&!fl.l))return 0;if(q&&!w.en.toLowerCase().includes(q)&&!w.zh.includes(q))return 0;return 1;});document.getElementById("sc").textContent=F.length;rn();}

function rn(){
  var c=document.getElementById("c"),h="";
  if(!F.length){c.innerHTML='<div class="empty">📭 没有匹配的词汇</div>';return;}
  var pp=W.length/45,totG=0;
  for(var i=1;i<=45;i++){
    var st=Math.round((i-1)*pp),en=Math.round(Math.min(i*pp,W.length));
    var lw=F.filter(function(w){return W.indexOf(w)>=st&&W.indexOf(w)<en;});
    if(!lw.length)continue;
    var g={};
    lw.forEach(function(w){var key=w.theme||"其他";if(!g[key])g[key]=[];g[key].push(w);});
    var gc=Object.keys(g).length;totG+=gc;
    h+='<div class="sec"><div class="sec-hd" onclick="this.classList.toggle(\'c\');this.nextElementSibling.classList.toggle(\'h\')"><span class="title">📘 单元'+i+' <span class="meta">'+lw.length+'词 · '+gc+'组</span></span><span class="arrow">▼</span></div><div class="sec-bd">';
    var sorted=Object.entries(g).sort(function(a,b){return b[1].length-a[1].length;});
    for(var j=0;j<sorted.length;j++){
      var theme=sorted[j][0],words=sorted[j][1];
      var emoji=TE[theme]||"📝",url=imgUrl(theme);
      if(theme!=="其他"&&url){
        h+='<div class="theme-card"><div class="theme-img"><div class="skeleton"></div><img src="'+url+'" alt="'+theme+'" loading="lazy" onload="this.classList.add(\'loaded\');this.previousElementSibling.style.display=\'none\'" onerror="this.style.display=\'none\';this.previousElementSibling.style.display=\'none\'"><div class="gradient"></div><div class="img-label"><span class="emoji-icon">'+emoji+'</span>'+theme+'</div></div><div class="theme-bd">';
        words.forEach(function(w){
          var lc=w.level==="高频"?"h":w.level==="中频"?"m":"l",ll=w.level==="高频"?"🔥":w.level==="中频"?"📖":"🌱";
          h+='<div class="word-item"><span class="en">'+w.en+'</span><span class="zh">'+w.zh+' <span class="lv '+lc+'">'+ll+'</span></span></div>';
        });
        h+='</div></div>';
      }else{
        h+='<div class="theme-card"><div class="theme-hd-fb"><div class="root"><span class="emoji-icon">'+emoji+'</span>'+theme+'</div></div><div class="theme-bd">';
        words.forEach(function(w){
          var lc=w.level==="高频"?"h":w.level==="中频"?"m":"l",ll=w.level==="高频"?"🔥":w.level==="中频"?"📖":"🌱";
          h+='<div class="word-item"><span class="en">'+w.en+'</span><span class="zh">'+w.zh+' <span class="lv '+lc+'">'+ll+'</span></span></div>';
        });
        h+='</div></div>';
      }
    }
    h+='</div></div>';
  }
  document.getElementById("sg").textContent=totG;
  c.innerHTML=h;
}

document.getElementById("q").addEventListener("input",function(){clearTimeout(window._dt);window._dt=setTimeout(function(){fl.q=this.value;go();}.bind(this),200);});
load();
