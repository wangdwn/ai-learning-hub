<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思维导图速记 高中英语词汇</title>
<style>
:root {
  --primary: #2d9e5a;
  --primary-light: #e8f5ed;
  --accent: #f39c12;
  --bg: #f9fbf9;
  --card-bg: #fff;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --border: #e0e0e0;
  --high-bg: #e8f5ed;
  --high-text: #1b7a3a;
  --mid-bg: #fff8e1;
  --mid-text: #b8860b;
  --low-bg: #f0f0f5;
  --low-text: #555;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
header {
  background: linear-gradient(135deg, #2d9e5a 0%, #4caf50 100%);
  color: #fff; padding: 28px 20px 20px; text-align: center;
}
header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
header p { font-size: 13px; opacity: .85; margin-top: 6px; }
.stats-bar {
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
  font-size: 13px; color: var(--text-light); position: sticky; top: 0; z-index: 10;
}
.stats-bar strong { color: var(--primary); }
.controls {
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
}
.controls input {
  flex: 1; min-width: 160px; max-width: 360px;
  padding: 8px 14px; border: 1px solid var(--border); border-radius: 20px;
  font-size: 14px; outline: none; transition: border .2s;
}
.controls input:focus { border-color: var(--primary); }
.level-btn {
  padding: 5px 14px; border: 1px solid var(--border); border-radius: 16px;
  background: #fff; cursor: pointer; font-size: 13px; transition: all .2s; color: var(--text);
}
.level-btn.active { color: #fff; font-weight: 600; }
.level-btn.active.lv-high { background: var(--primary); border-color: var(--primary); }
.level-btn.active.lv-mid { background: var(--accent); border-color: var(--accent); }
.level-btn.active.lv-low { background: #888; border-color: #888; }
.level-btn.all { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.level-btn.all.active { background: var(--primary); color: #fff; }

.word-count { font-size: 12px; color: var(--text-light); }

.alphabet-nav {
  display: flex; flex-wrap: wrap; gap: 3px; justify-content: center;
  background: #fff; border-bottom: 1px solid var(--border); padding: 8px 12px;
}
.alphabet-nav a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%;
  font-size: 13px; text-decoration: none; color: var(--text); transition: all .15s;
  cursor: pointer;
}
.alphabet-nav a:hover { background: var(--primary-light); color: var(--primary); }
.alphabet-nav a.active { background: var(--primary); color: #fff; font-weight: 600; }

.word-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px; padding: 14px 16px; max-width: 960px; margin: 0 auto;
}
.word-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; transition: all .2s;
}
.word-card:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(45,158,90,.12); }
.word-card .en {
  font-size: 15px; font-weight: 600; color: var(--primary);
  display: flex; align-items: center; gap: 8px;
}
.word-card .en .level-tag {
  font-size: 10px; font-weight: 500; padding: 1px 7px; border-radius: 8px;
}
.level-tag.high { background: var(--high-bg); color: var(--high-text); }
.level-tag.mid { background: var(--mid-bg); color: var(--mid-text); }
.level-tag.low { background: var(--low-bg); color: var(--low-text); }
.word-card .zh { font-size: 13px; color: var(--text); margin-top: 2px; }
.word-card .meta { font-size: 11px; color: var(--text-light); margin-top: 4px; }

.pagination {
  display: flex; justify-content: center; align-items: center; gap: 6px;
  padding: 16px; flex-wrap: wrap;
}
.pagination a, .pagination span.page-btn {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; text-decoration: none; color: var(--text); cursor: pointer;
  transition: all .15s; background: #fff;
}
.pagination a:hover, .pagination span.page-btn:hover { background: var(--primary-light); border-color: var(--primary); }
.pagination a.active, .pagination span.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pagination a.disabled, .pagination span.page-btn.disabled { opacity: .4; pointer-events: none; }
.pagination .page-info { font-size: 13px; color: var(--text-light); padding: 0 8px; }

.loading { display: flex; justify-content: center; align-items: center; padding: 60px 20px; }
.loading::after { 
  content: ""; width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error { text-align: center; padding: 40px; color: #e74c3c; }
.empty { text-align: center; padding: 40px; color: var(--text-light); }
.empty .icon { font-size: 48px; }
</style>
</head>
<body>

<header>
  <h1>🌿 思维导图速记 高中英语词汇</h1>
  <p>俞敏洪 编著 · 收录 <span id="totalWords">0</span> 词</p>
</header>

<div class="stats-bar">
  <span>📚 高频 <strong id="highCount">0</strong></span>
  <span>📖 中频 <strong id="midCount">0</span>
  <span>📗 补充 <strong id="lowCount">0</strong></span>
  <span>| 当前 <strong id="shownCount">0</strong> 条</span>
</div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 搜索单词或中文...">
  <div style="display:flex;flex-wrap:wrap;gap:5px;">
    <button class="level-btn all active" data-level="all" onclick="setLevel('all')">全部</button>
    <button class="level-btn lv-high active" data-level="high" onclick="setLevel('high')">高频</button>
    <button class="level-btn lv-mid active" data-level="mid" onclick="setLevel('mid')">中频</button>
    <button class="level-btn lv-low active" data-level="low" onclick="setLevel('low')">补充</button>
  </div>
</div>

<div class="alphabet-nav" id="alphabetNav"></div>

<div id="wordCount" class="word-count" style="text-align:center;padding:6px;"></div>
<div id="wordGrid" class="word-grid"></div>
<div id="pagination" class="pagination"></div>

<script>
const PER_PAGE = 60;
let allWords = [];
let filteredWords = [];
let currentPage = 1;
let filters = { level: { all: true, high: true, mid: true, low: true }, search: '', letter: '' };

async function loadData() {
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '<div class="loading"></div>';
  try {
    const resp = await fetch('vocab.json?_=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    allWords = await resp.json();
    document.getElementById('totalWords').textContent = allWords.length;
    
    const levels = { high: 0, mid: 0, low: 0 };
    allWords.forEach(w => { levels[w.level] ? levels[w.level]++ : (levels[w.level]=1); });
    document.getElementById('highCount').textContent = levels['高频'] || 0;
    document.getElementById('midCount').textContent = levels['中频'] || 0;
    document.getElementById('lowCount').textContent = levels['补充'] || 0;
    
    buildAlphabetNav();
    applyFilters();
  } catch(e) {
    grid.innerHTML = '<div class="error">⚠️ 词汇数据加载失败: ' + e.message + '<br><br>请检查 <code>vocab.json</code> 文件是否存在</div>';
  }
}

function setLevel(level) {
  document.querySelectorAll('.level-btn').forEach(b => {
    if (b.dataset.level === level) {
      b.classList.toggle('active');
    }
  });
  // Ensure "all" reflects individual states
  const allActive = ['high','mid','low'].every(l => 
    document.querySelector(`.level-btn[data-level="${l}"]`).classList.contains('active')
  );
  document.querySelector('.level-btn[data-level="all"]').classList.toggle('active', allActive);
  
  filters.level.high = document.querySelector('.level-btn[data-level="high"]').classList.contains('active');
  filters.level.mid = document.querySelector('.level-btn[data-level="mid"]').classList.contains('active');
  filters.level.low = document.querySelector('.level-btn[data-level="low"]').classList.contains('active');
  currentPage = 1;
  applyFilters();
}

function setLetter(letter) {
  document.querySelectorAll('#alphabetNav a').forEach(a => a.classList.remove('active'));
  if (letter === '#') {
    filters.letter = 'non-alpha';
    document.querySelector('#alphabetNav a[data-letter="#"]')?.classList.add('active');
  } else {
    filters.letter = letter;
    document.querySelector(`#alphabetNav a[data-letter="${letter}"]`)?.classList.add('active');
  }
  if (!letter) filters.letter = '';
  currentPage = 1;
  applyFilters();
}

function setSearch(search) {
  filters.search = search.toLowerCase();
  currentPage = 1;
  applyFilters();
}

function applyFilters() {
  filteredWords = allWords.filter(w => {
    // Level filter
    const lvl = w.level;
    if (lvl === '高频' && !filters.level.high) return false;
    if (lvl === '中频' && !filters.level.mid) return false;
    if (lvl === '补充' && !filters.level.low) return false;
    
    // Search filter
    if (filters.search && !w.en.toLowerCase().includes(filters.search) && !w.zh.includes(filters.search)) return false;
    
    // Letter filter
    if (filters.letter) {
      const firstChar = w.en[0].toLowerCase();
      if (filters.letter === 'non-alpha') {
        if (/[a-z]/.test(firstChar)) return false;
      } else {
        if (firstChar !== filters.letter) return false;
      }
    }
    
    return true;
  });
  
  document.getElementById('shownCount').textContent = filteredWords.length;
  render();
}

function render() {
  const totalPages = Math.max(1, Math.ceil(filteredWords.length / PER_PAGE));
  const start = (currentPage - 1) * PER_PAGE;
  const pageWords = filteredWords.slice(start, start + PER_PAGE);
  
  const grid = document.getElementById('wordGrid');
  if (pageWords.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="icon">📭</div><p>没有匹配的词汇</p></div>';
  } else {
    grid.innerHTML = pageWords.map(w => {
      const lvlClass = w.level === '高频' ? 'high' : w.level === '中频' ? 'mid' : 'low';
      const lvlLabel = w.level === '高频' ? '🔥高频' : w.level === '中频' ? '📖中频' : '🌱补充';
      return `<div class="word-card">
        <div class="en">${w.en}<span class="level-tag ${lvlClass}">${lvlLabel}</span></div>
        <div class="zh">${w.zh}</div>
      </div>`;
    }).join('');
  }
  
  document.getElementById('wordCount').textContent = `第 ${currentPage}/${totalPages} 页 · 共 ${filteredWords.length} 条`;
  
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const p = document.getElementById('pagination');
  let html = '';
  
  html += `<span class="page-btn ${currentPage <= 1 ? 'disabled' : ''}" onclick="goPage(${currentPage - 1})">◀</span>`;
  
  let startP = Math.max(1, currentPage - 4);
  let endP = Math.min(totalPages, currentPage + 4);
  if (startP > 1) { html += `<span class="page-btn" onclick="goPage(1)">1</span><span style="color:var(--text-light);padding:0 4px;">...</span>"; }
  for (let i = startP; i <= endP; i++) {
    html += `<span class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</span>`;
  }
  if (endP < totalPages) { html += `<span style="color:var(--text-light);padding:0 4px;">...</span><span class="page-btn" onclick="goPage(${totalPages})">${totalPages}</span>`; }
  
  html += `<span class="page-btn ${currentPage >= totalPages ? 'disabled' : ''}" onclick="goPage(${currentPage + 1})">▶</span>`;
  p.innerHTML = html;
}

function goPage(p) {
  const total = Math.max(1, Math.ceil(filteredWords.length / PER_PAGE));
  if (p < 1 || p > total) return;
  currentPage = p;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildAlphabetNav() {
  const nav = document.getElementById('alphabetNav');
  let html = '<a data-letter="" onclick="setLetter(\'\')" class="active">All</a>';
  for (let c = 97; c <= 122; c++) {
    html += `<a data-letter="${String.fromCharCode(c)}" onclick="setLetter('${String.fromCharCode(c)}')">${String.fromCharCode(c).toUpperCase()}</a>`;
  }
  html += `<a data-letter="#" onclick="setLetter('#')">#</a>`;
  nav.innerHTML = html;
}

// Search with debounce
let searchTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => setSearch(this.value), 300);
});

loadData();
</script>
</body>
</html>
